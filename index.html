<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novel Studio</title>
<script>(function(){var m='dark';try{m=localStorage.getItem('theme')||'dark'}catch(e){}window.__applyTheme=function(m){var t=m==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.setAttribute('data-theme',t)};window.__applyTheme(m)})()</script>
<style>
:root{--bg:#f5f1ea;--pn:#fffdf9;--tx:#2b2620;--mu:#8a8174;--ac:#c4673a;--bd:#e3dccf;--us:#ece4d6}
:root[data-theme=dark]{color-scheme:dark;--bg:#16140f;--pn:#201d18;--tx:#ece6da;--mu:#a0978a;--ac:#e8905f;--bd:#363128;--us:#2d2922}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI",Sarabun,"Noto Sans Thai",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-family:Georgia,serif;font-size:17px}
select,input,textarea,button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
nav{display:flex;gap:2px;padding:0 8px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;white-space:nowrap}
nav button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;flex-direction:column}.tab.on{display:flex}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:820px;width:100%;margin:0 auto;white-space:pre-wrap;word-wrap:break-word}
.m.user{background:var(--us);padding:10px 14px;border-radius:14px;align-self:flex-end}
.draft{border:1px solid var(--ac);border-radius:10px;margin:8px 0;background:var(--pn);white-space:pre-wrap;font-family:Georgia,"EB Garamond",serif;font-size:16px}
.draft .bar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);font:13px sans-serif;color:var(--mu);align-items:center;flex-wrap:wrap}
.draft .body{padding:10px 14px}
#cbar{border-top:1px solid var(--bd);background:var(--pn);padding:8px 12px}
#cbar .row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;resize:none;max-height:180px}
.small{font-size:12px;color:var(--mu)}
.split{flex:1;min-height:0;display:flex}
#chl{width:220px;border-right:1px solid var(--bd);overflow:auto;padding:8px;background:var(--pn)}
#chl div{padding:7px 9px;border-radius:8px;cursor:pointer}#chl div.on{background:var(--us)}
#ed{flex:1;display:flex;flex-direction:column;padding:10px;gap:8px;min-width:0}
#edt{flex:1;resize:none;font-family:Georgia,"EB Garamond",serif;font-size:17px;line-height:1.6}
.pad{padding:14px;overflow:auto;max-width:820px;width:100%;margin:0 auto}
/* setup */
#t-setup .pad{padding-bottom:80px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
details.sec{background:var(--pn);border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow:hidden}
details.sec>summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"▾";color:var(--mu)}details.sec[open]>summary::after{content:"▴"}
.fr{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--bd)}
.fr .lb{width:110px;flex:none;color:var(--mu);font-size:13px}
.fr .val{flex:1;min-width:0;text-align:left;border:1px dashed var(--bd);border-radius:8px;padding:6px 10px;background:none;overflow:hidden;text-overflow:ellipsis}
.fr .val.empty{color:var(--mu)}
.fr button.i{padding:4px 8px;border:0;background:none;opacity:.7}.fr button.i.on{opacity:1}
.fr textarea{flex:1;min-height:56px;resize:vertical}
.card2{background:var(--pn);border:1px solid var(--ac);border-radius:12px;margin:10px 0;overflow:hidden}
.card2 .hd{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--us)}
.card2 .hd input{flex:1;min-width:0}
.sub{margin:6px 12px 10px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.sub .hd{background:none;border-bottom:1px solid var(--bd);display:flex;gap:6px;padding:6px 8px;align-items:center}
.sub .hd input{flex:1;min-width:0}
.card2.lockd{border-style:dashed}
.card2 .hd{flex-wrap:wrap}.card2 .hd .sum{flex-basis:100%;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card2 .hd button.i{padding:4px 8px;border:0;background:none}.card2 .hd button.i.on{opacity:1}
.am{max-width:92%;white-space:pre-wrap;word-wrap:break-word;padding:8px 12px;margin:6px 0;border-radius:12px;background:var(--us)}
.am.user{margin-left:auto;background:var(--ac);color:#fff}
.prop{border:1px solid var(--ac);border-radius:10px;margin:6px 0;padding:8px 10px;background:var(--pn)}
.prop pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.5;margin:6px 0;max-height:40vh;overflow:auto}
#achat{padding:8px 12px;max-height:50vh;overflow:auto}
/* picker */
#pk{margin:auto auto 0;width:min(100%,680px);max-height:84vh;border-radius:16px 16px 0 0;padding:0;border:1px solid var(--bd);background:var(--pn);color:var(--tx)}
#pk[open]{display:flex;flex-direction:column}
#pk::backdrop{background:rgba(0,0,0,.45)}
#pk .ph{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
#pk .ph b{flex:1}
#pk .pc{padding:8px 14px;display:flex;gap:6px;border-bottom:1px solid var(--bd)}#pk .pc input{flex:1;min-width:0}
#pl{flex:1;overflow:auto;padding:4px 8px;min-height:30vh}
#pl label{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer}
#pl label:hover{background:var(--us)}#pl label.sel{background:var(--us);font-weight:600}
#pl .gh{position:sticky;top:0;background:var(--pn);color:var(--ac);font-size:12px;font-weight:700;padding:8px 8px 4px;letter-spacing:.03em}
#pl label span.en{font-size:12px;color:var(--mu);margin-left:auto;text-align:right}
#pk .pf{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.df{margin:4px 0;font-size:13px;line-height:1.5}.df del{display:block;background:rgba(220,70,70,.18);text-decoration:line-through;padding:2px 6px;border-radius:4px}.df ins{display:block;background:rgba(60,170,90,.2);text-decoration:none;padding:2px 6px;border-radius:4px;margin-top:2px}
.cbox{border-top:1px solid var(--bd);padding:8px 12px;background:var(--bg)}
.cmsgs{max-height:42vh;overflow:auto}
.chd{display:flex;align-items:center;gap:8px;min-width:0}
.chd .ct{flex:0 0 auto;font-weight:600}
.chd .pv{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chd .top{flex:0 0 auto}
.cbox.shut .cmsgs,.cbox.shut .crow,.cbox.shut .cnote{display:none}
.cbox:not(.shut) .chd{margin-bottom:6px}
.chd .typing{color:var(--ac,#6cf)}
.crow{display:flex;gap:6px;align-items:flex-end;margin-top:6px}.crow textarea{flex:1;resize:vertical}
.chc textarea.ed{width:calc(100% - 24px);margin:0 12px 10px;min-height:260px;resize:vertical;font-family:Georgia,"EB Garamond",serif;font-size:17px;line-height:1.6}
.chc textarea.sm{flex:1}
.dr{border-top:1px solid var(--bd);padding:8px 12px}.drh{display:flex;gap:6px;align-items:center}.drh .dt{flex:1;min-width:0}.drh .dw{width:80px}
.dr .ds{width:100%;margin-top:6px;resize:vertical}
.card2 .hd .ttl{flex:1;min-width:120px;font-weight:600}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;max-width:90vw;font-size:14px}
@media(max-width:700px){.split{flex-direction:column}#chl{width:auto;max-height:28vh;border-right:0;border-bottom:1px solid var(--bd)}.fr .lb{width:84px}}
</style></head><body>
<header><b>📖 Novel Studio</b>
<select id="book"></select><select id="mode" title="โหมดเรื่อง: ตั้งค่าการเขียนให้ตรงแนว"><option value="general">โหมดทั่วไป</option><option value="erotic">โหมดนิยายอีโรติก</option></select><button id="nb">+ เรื่องใหม่</button><button id="delb" title="ลบนิยายเรื่องนี้ (ย้ายไปถังขยะ)">🗑</button>
<span class="small" id="st">…</span><span style="flex:1"></span>
<button id="thb" title="โหมดสี">🌙</button><button id="setb">⚙︎</button></header>
<nav><button data-t="chat" class="on">แชท</button><button data-t="ms">ต้นฉบับ</button><button data-t="setup">ตั้งค่าเรื่อง</button><button data-t="ex">ส่งออก PDF</button><button data-t="tr">ถังขยะ</button></nav>
<main>
<section class="tab on" id="t-chat">
 <div id="msgs"></div>
 <div id="cbar"><div class="row">
  <textarea id="inp" rows="2" placeholder="พิมพ์ภาษาไทยได้ — เนื้อนิยายจะอยู่ในกล่อง draft"></textarea>
  <button class="p" id="send">ส่ง</button><button id="stop" style="display:none">หยุด</button></div>
  <div class="row small" style="margin-top:4px"><span>ตอนที่ใช้เป็นบริบท: <select id="csel"></select></span>
  <label><input type="checkbox" id="think"> คิดก่อนตอบ</label><button id="clr">ล้างแชท</button></div></div>
</section>
<section class="tab" id="t-ms"><div class="pad" id="msw" style="max-width:900px"></div></section>
<section class="tab" id="t-setup"><div class="pad" id="su"></div></section>
<section class="tab" id="t-tr"><div class="pad" id="trw"></div></section>
<section class="tab" id="t-ex"><div class="pad"><h3>ส่งออก PDF</h3>
 <p><select id="sz"><option value="iphone">iPhone (หน้า 90×160 มม.)</option><option value="ipad">iPad (หน้า A5 148×210 มม.)</option><option value="a4">A4 (พิมพ์ / อ่านบนคอม)</option></select> <select id="fs"><option value="s">ตัวเล็ก</option><option value="m">ตัวกลาง</option><option value="l">ตัวใหญ่</option><option value="xl">ตัวใหญ่มาก</option></select> <select id="lh"><option value="n">บรรทัดปกติ</option><option value="w">บรรทัดห่าง</option></select>
 <button class="p" id="dl">ดาวน์โหลด PDF ทั้งเล่ม</button></p><p class="small" id="exs"></p>
 <h3 style="margin-top:14px">เลือกเป็นรายตอน</h3><div id="exl"></div><p><button id="dls">ดาวน์โหลดตอนที่เลือก</button> <button id="dla">เลือกทั้งหมด</button> <button id="dlc">ล้างที่เลือก</button></p></div></section>
</main>
<dialog id="pk"><div class="ph"><b id="pt"></b><span class="small" id="pn"></span><button id="px">✕</button></div>
 <div class="pc"><input id="pi" placeholder="ค้นหา หรือพิมพ์เองแล้วกด + เพิ่ม"><button id="pa">+ เพิ่ม</button></div>
 <div id="pl"></div><div class="pf"><button id="pclr">ล้าง</button><button class="p" id="pok">ตกลง</button></div></dialog>
<dialog id="dlg" style="max-width:640px;width:92%;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:12px"><h3>ตั้งค่า</h3>
 <p class="small">System prompt (ใช้ {lang} แทนภาษาต้นฉบับ)</p><textarea id="sys" rows="12" style="width:100%"></textarea>
 <p>max tokens <input id="mx" type="number" size="6"> temperature <input id="tp" type="number" step="0.1" size="4"></p>
 <p><button class="p" id="sset">บันทึก</button> <button id="cset">ปิด</button></p></dialog>
<dialog id="prev" style="max-width:720px;width:94%;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:12px"><h3>Bible ที่ส่งให้โมเดล</h3><pre id="prevt" style="white-space:pre-wrap;max-height:60vh;overflow:auto;font-size:13px"></pre><button id="prevx">ปิด</button></dialog>
<script>

  if(act==="short"){const w=box.closest(".cbox"),m0=arr[mi],s=m0&&m0.short;if(w&&s){const need=Math.max(150,Math.round((s.target-s.have)*1.05));w.querySelector("textarea").value=`The chapter is ${s.have} words but the target is ${s.target}. Continue directly from the last sentence of the manuscript with about ${need} more words of the SAME scene (more dialogue, interior thought, concrete detail). Do not summarise, do not wrap up early, do not repeat anything already written.`;m0.short=null;sendScope(w,sc)}}
  else if(act==="cont"){const w=box.closest(".cbox");const msg="เขียนต่อจากประโยคสุดท้ายที่ค้างไว้ ใช้รูปแบบเดิม ไม่ต้องเริ่มใหม่";if(w){w.querySelector("textarea").value=msg;sendScope(w,sc)}else{$("#inp").value=msg;$("#send").click()}}
  else if(act==="undo"){const m=arr[mi];const r=await(await api(`books/${book}/chapters/${sc}/undo`,js("POST",{snap:m.applied.snap}))).json();CT[sc]=r.text;m.undone=true;saver();syncEditor(sc);renderMS();toast("ย้อนกลับแล้ว")}
  else if(act==="cp"){navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(b.dataset.b));toast("คัดลอกแล้ว")}
  else if(act==="ins")await insertInto(sc,decodeURIComponent(b.dataset.b));
  else if(act==="osend"){const o=parseJ(blockOf(arr[mi].content,"outline"));if(!o||!Array.isArray(o.chapters))throw new Error("โครงเรื่องไม่ถูกต้อง");
   OUT.draft=o.chapters.map(x=>({title:String(x.title||""),summary:String(x.summary||""),words:+x.words||0}));
   await api(`books/${book}/outline-draft`,js("PUT",{items:OUT.draft}));arr[mi].done=true;saver();FOLDS.outline=false;saveFolds();renderMS();
   if(sc==="overview"){gotoTab("ms");toast("ส่งไปช่อง Outline แล้ว — ตรวจ/แก้ แล้วกดอนุมัติ")}else toast("อัปเดตฉบับร่างแล้ว — กดอนุมัติเมื่อพร้อม")}
  else if(act==="capply"){const o=parseJ(blockOf(arr[mi].content,"chapter")),c=chs.find(x=>x.id===sc);if(!o||!c)throw new Error("ข้อเสนอไม่ถูกต้อง");if(c.locked)throw new Error("ตอนนี้ล็อกอยู่");
   const patch={};if(o.summary!=null){patch.summary=String(o.summary);c.summary=patch.summary}if(o.words!=null){patch.target=+o.words||0;c.target=patch.target}
   if(Object.keys(patch).length)await api(`books/${book}/outline/${sc}`,js("PUT",patch));
   if(o.title){const t=await ensureCh(sc);CT[sc]=setHead(t,String(o.title));c.title=String(o.title);await saveChapter(sc,true)}
   arr[mi].done=true;saver();renderMS();toast("ปรับตอนนี้แล้ว")}
 }catch(e){toast("ไม่สำเร็จ: "+e.message)}})}
async function insertInto(sc,txt){const id=/^ch\d+$/.test(sc)?sc:$("#csel").value;if(!id){toast("ยังไม่มีตอนที่เลือก — เลือกตอนที่ช่อง “ตอนที่ใช้เป็นบริบท” หรือสร้างตอนก่อน");return}
 const c=chs.find(x=>x.id===id);if(c&&c.locked){toast("ตอนนี้ล็อกอยู่ — ปลดล็อกก่อนแทรก");return}
 const t=await ensureCh(id);CT[id]=t.replace(/\s+$/,"")+"\n\n"+txt+"\n";await saveChapter(id,true);renderMS();toast("แทรกท้ายตอนแล้ว ("+(c?c.title:id)+")")}
async function readSSE(r,onDelta,onFin){const rd=r.body.getReader(),dc=new TextDecoder();let buf="";for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
 while((i=buf.indexOf("\n"))>=0){const ln=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!ln.startsWith("data:"))continue;const p=ln.slice(5).trim();if(p==="[DONE]")continue;try{const j=JSON.parse(p).choices[0];const c=j.delta&&j.delta.content;if(c)onDelta(c);if(j.finish_reason&&onFin)onFin(j.finish_reason)}catch(e){}}}}

 const eb=blockInfo(m.content,"edit"),db=blockInfo(m.content,"draft");let edits=[],append="";

 if(db&&(db.closed||m.trunc)&&db.body.trim())append=db.body.replace(/\n+$/,"");
 if(!edits.length&&!append)return;

  CT[sc]=r.text;m.applied={snap:r.snap,n:edits.length,appended:!!append};syncEditor(sc);if(append){const c2=chs.find(x=>x.id===sc);if(c2&&c2.target>0&&c2.words<c2.target*0.85)m.short={have:c2.words,target:c2.target}}toast(edits.length?`แก้ในต้นฉบับแล้ว ${edits.length} จุด`:"ต่อท้ายต้นฉบับแล้ว")}
 catch(e){let errs=[{why:e.message}];m.applyErr=errs;toast("แก้ไม่สำเร็จ: "+e.message)}}
